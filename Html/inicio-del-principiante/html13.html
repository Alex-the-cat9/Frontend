<!DOCTYPE html>
<html lang="en">
<head>

    <title>Tablas</title>
    <link rel="stylesheet" href="pinto14.css">
</head>
<body>
<table border="1" class="tabla">
    <tr class="tabla1">
        <th>
            producto
        </th>

        <td>precio</td>
    </tr>
    <tr class="tabla2">
        <th>camarones</th>
        <th>normal</th>
        <td class="precio1">12.6$</td>
    </tr>
    <tr class="tabla3">
        <th>pollo</th>
        <th class="premiun">premiun</th>
        <td class="precio2">40$</td>
    </tr>
    <tr>
        <td colspan="2"><b>precio del camaron y pollo:</b></td>
        <td class="precio3">52.6$</td>
    </tr>
</table>
</body>
</html>
