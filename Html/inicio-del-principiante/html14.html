    <title>mejorando en Tablas</title>
    <link rel="stylesheet" href="pinto15.css">

<body>
    <table border="1" class="tabla">
        <tr>
            <th>Producto</th>
            <th>Imaguen</th>

        <tr>
            <td>camarones</td>

            <td><span style="color: green;">40</span>$</td>
        </tr>
        <tr>
            <td>Pollo frito</td>

            <td><span style="color: green;">60</span>$</td>
        </tr>
        <tr>
            <td colspan="3"><b>Precio de su menu completo:</b></td>
            <td><span style="color: green;">100</span>$</td>
        </tr>
    </table>
</body>
</html>
