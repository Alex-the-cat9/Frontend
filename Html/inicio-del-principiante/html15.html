<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tablas avansado</title>
    <style>
        table, th, td {
            border: 1px solid black;

        }
        body {
            background-color:khaki;
        }
        table {
            width: 340px;
        }
        th {
            background-color: bisque;
        }
        td {
            background-color: cornflowerblue;
        }
        .precio1 {
            background-color: aquamarine;
            color: green;
        }
        .precio2 {
            background-color: aquamarine;
            color: green;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>producto</th>
            <th>precio</th>
        </tr>
        <tr>
            <td>pollo asado</td>
            <td class="precio1">50$</td>
        </tr>
        <tr>
            <td>pescado cocido</td>
            <td class="precio2">30$</td>
        </tr>
    </table>
</body>
</html>
