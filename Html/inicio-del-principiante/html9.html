<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decorado_y_registro</title>
    <link rel="stylesheet" href="pinto9.css">
</head>
<body>
    <form action="/sistema_de_registro" method="post">
        <label for="nombre-id">Nombre:</label><br>
        <input type="text" id="nombre-id" name="nombre_del_usuario" placeholder="ejem:alex" class="nombre">
        <br><label for="contraseña-id">Contraseña:</label><br>
        <input type="password" id="contraseña-id" class="contraseña" placeholder="ejem:123">
        <br>
        <br>
        <button type="submit" class="envio">Enviar</button>
        <hr>
        <h2>se enviaran tus datos al servidor</h2>
    </form>
    
</body>
</html>
